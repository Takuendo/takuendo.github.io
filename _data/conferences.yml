# Conference / travel history shown on /conference-map/
#
# To add a new entry, append a block below. Nothing else needs to change.
#
#   id        unique slug (also usable as a deep link: /conference-map/#etmm15)
#   name      short name shown as the heading
#   title     full official name (optional)
#   city, country, lat, lon   location (entries with the same lat/lon share one dot)
#   year      used for sorting and the timeline
#   date      free text, e.g. "September 2025"
#   summary   one or two sentences shown in the card (optional)
#   photos    list of src / alt / caption (files that already exist in /assets/; optional)
#   post      file name of the blog post in _posts/ WITHOUT ".md"
#             (resolved to the correct URL automatically, so permalinks can change)
#
# Template:
#
# - id: example27
#   name: "Example27"
#   title: "27th Example Conference"
#   city: "Vienna"
#   country: "Austria"
#   lat: 48.2082
#   lon: 16.3738
#   year: 2027
#   date: "April 2027"
#   summary: "Oral presentation on ..."
#   photos:
#     - src: "/assets/Example27/1.jpeg"
#       alt: "Oral presentation at Example27"
#       caption: "Oral presentation at Example27"
#   post: "2027-04-10-Example27"

